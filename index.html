* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding-bottom: 30px; }

header { text-align: center; padding: 18px 0 4px; }

.pos { display: inline-block; font-size: 10.5px; color: var(--gold); border: 1px solid rgba(201,162,75,.35); border-radius: 8px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }

<body>
<div class="wrap">
  <header>
    <div class="eyebrow">ILM DICTIONARY</div>
    <h1>Arabic for the serious student</h1>
    <div class="sub">English &harr; Arabic · classical root meanings · Quran usage · audio · flashcards</div>
  </header>

  <div class="tabs">
    <button data-tab="search" class="active">Search</button>
    <button data-tab="roots">Roots</button>
    <button data-tab="browse">Browse</button>

  <div id="content"></div>

  <footer>Ilm Dictionary · built on the Ilm API · works offline once installed</footer>

<div id="installbar">
  <div class="ibtext">📲 <b style="color:var(--text)">Install Ilm Dictionary</b> on your home screen for offline study</div>
  <button class="btn small" id="ibinstall">Install</button>
  <button class="ibx" id="ibclose" aria-label="Dismiss install banner">✕</button>
</div>

<script>
const DEFAULT_KEY = "ilm_41cf502bdd0b2b07650bdb302edece3c";
const getKey = () => localStorage.getItem("ilm_key") || DEFAULT_KEY;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[c]));

// ---------- offline pack: the whole dictionary stored on the device ----------
let PACK = null; // { words, roots, groups, byRoot, rootMeta, byLetter }

function plainAr(w) {
  return String(w || "").replace(/[\u064B-\u065F\u0670\u06D6-\u06DC\u06DF-\u06E8\u06EA-\u06ED\u0640\s-]/g, "");
}
function packNormRoot(r) { return plainAr(r); }

function buildIndexes(p) {
  const groups = new Map(), byRoot = new Map(), byLetter = new Map();
  for (const e of p.words) {
    const pl = plainAr(e.word);
    if (!groups.has(pl)) groups.set(pl, []);
    groups.get(pl).push(e);
    if (e.root) {
      const rk = packNormRoot(e.root);
      if (!byRoot.has(rk)) byRoot.set(rk, []);
      byRoot.get(rk).push(e);
    }
    const ch = pl[0] || "";
    const letter = "\u0627\u0623\u0625\u0622\u0671".includes(ch) ? "\u0627" : ch;
    if (!byLetter.has(letter)) byLetter.set(letter, []);
    byLetter.get(letter).push(e);
  }
  const rootMeta = new Map();
  for (const r of p.roots || []) rootMeta.set(packNormRoot(r.root_arabic), r);
  return { ...p, groups, byRoot, rootMeta, byLetter, total: p.words.length };
}

// serve a dictionary GET from the pack, mirroring the API's response shapes
function localServe(path) {
  const packRootOcc = rk => {
    const m = PACK.rootMeta.get(rk);
    return m && m.occurrence_count ? m.occurrence_count : 0;
  };
  let m;
  if ((m = path.match(/^\/v1\/dictionary\/search\?q=([^&]+)/))) {
    const q = decodeURIComponent(m[1]);
    const isArabic = /[\u0600-\u06FF]/.test(q);
    let results = [];
    if (isArabic) {
      const pl = plainAr(q);
      for (const [k, es] of PACK.groups) {
        if (k === pl || k.startsWith(pl)) results = results.concat(es);
        if (results.length >= 50) break;
      }
    } else {
      const needle = q.toLowerCase();
      for (const e of PACK.words) {
        if (String(e.gloss_en || "").toLowerCase().includes(needle)) results.push(e);
        if (results.length >= 50) break;
      }
    }
    return { offlineOnly: true, data: { query: q, language: "en", count: results.length, results } };
  }
  if ((m = path.match(/^\/v1\/dictionary\/word\/([^?]+)/))) {
    const w = decodeURIComponent(m[1]);
    const es = PACK.groups.get(plainAr(w)) || [];
    const rk = es[0] && es[0].root ? packNormRoot(es[0].root) : null;
    return { data: { word: w, language: "en", quran_occurrences_of_root: rk ? packRootOcc(rk) : 0, entries: es } };
  }
  if ((m = path.match(/^\/v1\/dictionary\/words\?letter=([^&]+)&offset=(\d+)&limit=(\d+)/))) {
    const letter = decodeURIComponent(m[1]);
    const ch = plainAr(letter) || "\u0627";
    const l = PACK.byLetter.get(ch) || [];
    const offset = parseInt(m[2], 10) || 0;
    const limit = parseInt(m[3], 10) || 50;
    return { data: { letter, offset, count: Math.min(limit, l.length - offset), total: l.length, words: l.slice(offset, offset + limit) } };
  }
  if ((m = path.match(/^\/v1\/dictionary\/root\/([^?]+)/))) {
    const rk = packNormRoot(decodeURIComponent(m[1]));
    const es = PACK.byRoot.get(rk) || [];
    const meta = PACK.rootMeta.get(rk) || {};
    return { data: {
      root: (es[0] && es[0].root) || decodeURIComponent(m[1]),
      quranic: meta.root_arabic ? { root_arabic: meta.root_arabic, meaning: meta.meaning, occurrence_count: meta.occurrence_count } : {},
      entry_count: es.length,
      entries: es
    } };
  }
  if (path === "/v1/dictionary/roots") {
    const roots = [...PACK.byRoot.entries()].map(([rk, es]) => ({
      root: es[0].root, entry_count: es.length,
      quran_occurrences: packRootOcc(rk)
    })).sort((a, b) => b.entry_count - a.entry_count || (a.root < b.root ? -1 : 1));
    return { data: { count: roots.length, roots } };
  }
  if (path === "/v1/roots" || path.startsWith("/v1/roots?")) {
    const roots = (PACK.roots || []).map(r => ({ root: r.root_arabic, root_arabic: r.root_arabic, meaning: r.meaning, occurrence_count: r.occurrence_count }));
    return { data: { count: roots.length, roots } };
  }
  return null;
}

// IndexedDB helpers — 4-6MB pack is too big for localStorage
function idbOpen() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open("ildict-pack", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("pack");
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbAction(mode, method, value) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const store = db.transaction("pack", mode).objectStore("pack");
    const t = method === "put" ? store.put(value, "v1") : store[method]("v1");
    t.onsuccess = () => res(t.result);
    t.onerror = () => rej(t.error);
  });
}
const packGet = () => idbAction("readonly", "get").catch(() => null);
const packPut = v => idbAction("readwrite", "put", v).then(() => v);
const packDel = () => idbAction("readwrite", "delete").catch(() => {});

async function downloadPack(onProgress) {
  const r = await fetch(API_BASE + "/v1/dictionary/offline", { headers: { "x-api-key": getKey() } });
  if (!r.ok) throw new Error("Download failed");
  const total = +(r.headers.get("content-length") || 4800000);
  let got = 0;
  const chunks = [];
  const reader = r.body.getReader();
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    got += value.length;
    onProgress(Math.min(99, Math.round(got / total * 100)));
  }
  const blob = new Blob(chunks);
  const data = JSON.parse(await blob.text());
  await packPut({ words: data.words, roots: data.roots });
  PACK = buildIndexes({ words: data.words, roots: data.roots });
  return data.words.length;
}
const removePack = async () => { await packDel(); PACK = null; };

function offlineCardHTML() {
  if (PACK) return `<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <span style="font-size:13px">✓ <b style="color:var(--gold)">${(PACK.total || 0).toLocaleString()}</b> words saved on this device — the whole dictionary works offline</span>
    <button class="btn ghost" id="packDel" style="font-size:12px;padding:6px 10px">Remove</button>
  </div>`;
  return `<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <span style="font-size:13px">📥 Save the <b style="color:var(--gold)">whole dictionary</b> (36,500+ words, ~2 MB) for fully offline study</span>
    <button class="btn" id="packDl" style="font-size:12px;padding:6px 10px;white-space:nowrap">Download</button>
  </div>`;
}
function wireOfflineCard() {
  const d = $("#packDl"), x = $("#packDel");
  if (d) d.addEventListener("click", async () => {
    d.disabled = true;
    const card = d.closest(".card");
    card.innerHTML = `<span style="font-size:13px" id="packStat">Downloading dictionary… 0%</span>`;
    try {
      const n = await downloadPack(p => { const s = $("#packStat"); if (s) s.textContent = `Downloading dictionary… ${p}%`; });
      card.innerHTML = `<span style="font-size:13px">✓ <b style="color:var(--gold)">${n.toLocaleString()}</b> words saved — you are fully offline now</span><button class="btn ghost" id="packDel" style="font-size:12px;padding:6px 10px">Remove</button>`;
      const xx = $("#packDel");
      if (xx) xx.addEventListener("click", async () => { await removePack(); renderSearch(); });
    } catch (e) {
      card.innerHTML = `<span style="font-size:13px;color:var(--red)">Download failed: ${esc(e.message)}</span>`;
    }
  });
  if (x) x.addEventListener("click", async () => { await removePack(); renderSearch(); });
}

async function api(path) {
  if (PACK) {
    const local = localServe(path);
    if (local && (!local.offlineOnly || !navigator.onLine)) return local.data;
  }
  const r = await fetch(API_BASE + path, { headers: { "x-api-key": getKey() } });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Request failed");
  return data;
}

// ---------- transliteration: match romanized queries like "sabr" ----------
const AR_STRIP = /[\u064B-\u0652\u0640\u0670]/g; // harakat, tatweel
const AR_VOWELS = "\u0627\u0623\u0625\u0622\u0648\u064A\u0649\u0624\u0626\u0621"; // alif/hamza forms, waw, ya, alif maqsura
function arSkeleton(w) {
  // consonant skeleton of an Arabic word: diacritics and long vowels removed
  w = String(w || "").replace(AR_STRIP, "").replace(/-/g, "");
  let out = "";
  for (const ch of w) { if (!AR_VOWELS.includes(ch)) out += ch; }
  return out;
}
const AR2LAT = { "\u0621":"'", "\u0622":"a", "\u0623":"'", "\u0625":"i", "\u0626":"y", "\u0624":"w", "\u0627":"a", "\u0628":"b", "\u0629":"h", "\u062A":"t", "\u062B":"th", "\u062C":"j", "\u062D":"h", "\u062E":"kh", "\u062F":"d", "\u0630":"dh", "\u0631":"r", "\u0632":"z", "\u0633":"s", "\u0634":"sh", "\u0635":"s", "\u0636":"d", "\u0637":"t", "\u0638":"z", "\u0639":"'", "\u063A":"gh", "\u0640":"", "\u0641":"f", "\u0642":"q", "\u0643":"k", "\u0644":"l", "\u0645":"m", "\u0646":"n", "\u0647":"h", "\u0648":"w", "\u0649":"a", "\u064A":"y" };
function latSkeleton(q) {
  // consonant skeleton of a romanized query: digraphs first, vowels dropped
  q = String(q || "").toLowerCase().trim().replace(/[^a-z]/g, "");
  let out = "";
  for (let i = 0; i < q.length; i++) {
    const two = q.slice(i, i + 2);
    if (["th","kh","dh","sh","gh"].includes(two)) { out += two; i++; continue; }
    const c = q[i];
    if (!"aeiou".includes(c)) out += c;
  }
  return out;
}
const ROOTS_CACHE_KEY = "ildict_roots_cache";
async function getRootsCached() {
  try {
    const c = JSON.parse(localStorage.getItem(ROOTS_CACHE_KEY) || "null");
    if (c && Date.now() - c.t < 7 * 86400000) return c.data;
  } catch (e) {}
  const data = await api("/v1/roots");
  try { localStorage.setItem(ROOTS_CACHE_KEY, JSON.stringify({ t: Date.now(), data })); } catch (e) {}
  return data;
}
function normLat(sk) { return sk.replace(/^'+/, "").replace(/[wy]/g, "").replace(/h+$/, ""); }
function rootSkeletonLat(root) {
  const sk = arSkeleton(root);
  if (!sk) return "";
  return normLat([...sk].map(c => AR2LAT[c] !== undefined ? AR2LAT[c] : c).join(""));
}
async function translitLookup(q) {
  const sk = latSkeleton(q);
  if (!sk) return [];
  const roots = await getRootsCached();
  const withSk = roots.map(r => ({ r, rsk: rootSkeletonLat(r.root_arabic) })).filter(x => x.rsk);
  // exact skeleton match (handles ta marbuta "h", weak letters, ayn)
  let hits = withSk.filter(x => x.rsk === normLat(sk)).map(x => x.r);
  // prefix/suffix forms: "muslim" contains root slm, "istaqam" contains qm
  if (hits.length === 0) {
    hits = withSk.filter(x => x.rsk.length >= 2 && sk.includes(x.rsk)).map(x => x.r);
  }
  if (hits.length === 0) return [];
  const families = await Promise.all(hits.slice(0, 3).map(r => api(`/v1/dictionary/root/${encodeURIComponent(r.root_arabic)}`).catch(() => null)));
  return hits.slice(0, 3).map((r, i) => {
    const f = families[i];
    if (f) return { root: f.root, entry_count: f.entry_count, quranic: f.quranic || {}, entries: (f.entries || []).slice(0, 12) };
    // offline / never opened: still show the matched root from the cached root list
    return { root: r.root_arabic, entry_count: 0, quranic: { meaning: r.meaning || "", occurrence_count: r.occurrence_count || 0 }, entries: [] };
  });
}

// ---------- audio pronunciation ----------
const API_BASE = "https://ilm-api.vercel.app";
const AUDIO_CACHE = new Map(); // word -> object URL of the fetched MP3
let currentAudio = null;
let arVoice = null;

// Real recorded-style pronunciation from the Ilm API; falls back to the
// browser's built-in Arabic voice when offline or on error.
async function playWord(word, btn) {
  const w = String(word || "").trim();
  if (!w) return;
  if (currentAudio) { currentAudio.pause(); if (currentAudio._btn) currentAudio._btn.classList.remove("playing"); currentAudio = null; }
  try { speechSynthesis.cancel(); } catch (e) {}
  let url = AUDIO_CACHE.get(w);
  if (!url) {
    if (btn) btn.classList.add("loading");
    try {
      const r = await fetch(API_BASE + "/v1/dictionary/audio?word=" + encodeURIComponent(w), { headers: { "x-api-key": getKey() } });
      if (!r.ok) throw new Error("HTTP " + r.status);
      url = URL.createObjectURL(await r.blob());
      AUDIO_CACHE.set(w, url);
    } catch (e) {
      speak(w); // graceful fallback: device TTS
    } finally {
      if (btn) btn.classList.remove("loading");
    }
    if (!url) return;
  }
  const a = new Audio(url);
  a._btn = btn;
  if (btn) btn.classList.add("playing");
  a.onended = () => { if (btn) btn.classList.remove("playing"); if (currentAudio === a) currentAudio = null; };
  a.onerror = () => { if (btn) btn.classList.remove("playing"); if (currentAudio === a) currentAudio = null; speak(w); };
  currentAudio = a;
  a.play();
}

function speak(word) {
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(String(word).replace(AR_STRIP, ""));
  u.lang = "ar-SA";
  if (!arVoice) {
    const vs = speechSynthesis.getVoices();
    arVoice = vs.find(v => /^ar/i.test(v.lang)) || null;
  }
  if (arVoice) u.voice = arVoice;
  u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => { arVoice = null; };

// ---------- my words (vocabulary book) ----------
const WORDS_KEY = "ildict_words";
const myWords = () => JSON.parse(localStorage.getItem(WORDS_KEY) || "[]");
function isStarred(w) { return myWords().some(m => m.word === w); }
function toggleStar(word, gloss, root) {
  let ws = myWords();
  const ix = ws.findIndex(m => m.word === word);
  if (ix >= 0) ws.splice(ix, 1); else ws.unshift({ word, gloss: (gloss || "").slice(0, 300), root: root || "", added: Date.now() });
  localStorage.setItem(WORDS_KEY, JSON.stringify(ws));
  return ix < 0;
}

// ---------- spaced repetition (SRS) ----------
const SRS_KEY = "ildict_srs";
const STREAK_KEY = "ildict_streak";
const SRS_INTERVALS = [1, 2, 4, 7, 15, 30, 60]; // days
const srsAll = () => JSON.parse(localStorage.getItem(SRS_KEY) || "{}");
const dayMs = 86400000;
const srsDue = w => { const s = srsAll()[w]; return !s || s.due <= Date.now(); };
function srsRecord(word, knew) {
  const all = srsAll();
  const s = all[word] || { level: 0, due: 0 };
  s.level = knew ? Math.min((s.level || 0) + 1, SRS_INTERVALS.length - 1) : 0;
  s.due = knew ? Date.now() + SRS_INTERVALS[s.level] * dayMs : Date.now();
  s.seen = Date.now();
  all[word] = s;
  localStorage.setItem(SRS_KEY, JSON.stringify(all));
}
function dueCount() { return myWords().filter(w => srsDue(w.word)).length; }
function streakBump() {
  const st = JSON.parse(localStorage.getItem(STREAK_KEY) || '{"count":0,"last":""}');
  const today = new Date().toDateString();
  if (st.last === today) return st;
  const yest = new Date(Date.now() - dayMs).toDateString();
  st.count = st.last === yest ? st.count + 1 : 1;
  st.last = today;
  localStorage.setItem(STREAK_KEY, JSON.stringify(st));
  return st;
}
const streakGet = () => JSON.parse(localStorage.getItem(STREAK_KEY) || '{"count":0,"last":""}');

// ---------- views ----------
let tab = "search";

function srsChips(word) {
  const s = srsAll()[word];
  if (!s || !s.level) return "";
  const days = Math.max(0, Math.ceil((s.due - Date.now()) / dayMs));
  return `<div class="srs"><span class="srschip">✓ known ×${s.level}</span><span class="srschip ${days === 0 ? "due" : ""}">${days === 0 ? "due for review" : "reviews in " + days + "d"}</span></div>`;
}

function wordCard(e, opts = {}) {
  const starred = isStarred(e.word);
  return `<div class="card" ${opts.tapword ? `data-w="${esc(e.word)}"` : ""}>
    <button class="speak" data-say="${esc(e.word)}" title="Listen">🔊</button>
    <button class="star ${starred ? "on" : ""}" data-star="${esc(e.word)}" data-gloss="${esc((e.gloss_en||"").slice(0,120))}" data-root="${esc(e.root||"")}">${starred ? "★" : "☆"}</button>
    <div class="ar">${esc(e.word)}<span class="pos">${esc(e.pos || "")}</span></div>
    <div class="gloss">${esc(e.gloss_en || "")}</div>
    ${e.root ? `<span class="rootchip" data-root="${esc(e.root)}">جذر ${esc(e.root)}</span>` : ""}
    ${opts.quran !== false ? `<a class="qlink" href="https://quran.com/search?q=${encodeURIComponent(String(e.word).replace(AR_STRIP, ""))}" target="_blank" rel="noopener">📖 See in the Quran</a>` : ""}
    ${opts.srs ? srsChips(e.word) : ""}
    ${opts.tapword ? `<div class="note">Tap the word for all senses</div>` : ""}
  </div>`;
}

function wireCards(scope) {
  scope.querySelectorAll("[data-star]").forEach(b => b.addEventListener("click", ev => {
    ev.stopPropagation();
    const now = toggleStar(b.dataset.star, b.dataset.gloss, b.dataset.root);
    document.querySelectorAll(`[data-star="${CSS.escape(b.dataset.star)}"]`).forEach(x => { x.textContent = now ? "★" : "☆"; x.classList.toggle("on", now); });
  }));
  scope.querySelectorAll("[data-say]").forEach(b => b.addEventListener("click", ev => {
    ev.stopPropagation();
    playWord(b.dataset.say, b);
  }));
  scope.querySelectorAll(".rootchip, .rchip").forEach(b => b.addEventListener("click", ev => {
    ev.stopPropagation();
    showRoot(b.dataset.root);
  }));
  scope.querySelectorAll("[data-w]").forEach(c => c.addEventListener("click", () => showWord(c.dataset.w)));
}

// ---- SEARCH TAB ----
async function renderSearch() {
  const el = $("#content");
  el.innerHTML = `
    <div class="searchbar"><input id="q" aria-label="Search words" placeholder="English, Arabic or romanized — e.g. patience, صبر, sabr" /><button class="btn" id="go">Search</button></div>
    <div id="offlineCard">${offlineCardHTML()}</div>
    <div class="card wcard" id="wotd"><div class="wotd-label">📖 WORD OF THE DAY</div><div class="loading">…</div></div>
    <div id="results"></div>`;
  wireOfflineCard();
  const q = $("#q");
  const run = async () => {
    const v = q.value.trim();
    if (!v) return;
    $("#results").innerHTML = `<div class="loading">Searching…</div>`;
    const isArabic = /[\u0600-\u06FF]/.test(v);
    try {
      let html = "", translitDone = false;
      // transliteration matches (romanized queries) — best signal, shown first
      if (!isArabic) {
        try {
          const fams = await translitLookup(v);
          if (fams.length) {
            translitDone = true;
            html += `<p class="seclabel">ARABIC MATCHES FOR "${esc(v.toUpperCase())}"</p>`;
            for (const f of fams) {
              const qq = f.quranic || {};
              html += `<div class="card">
                <div class="ar" style="font-size:32px;text-align:center">${esc(f.root)}</div>
                ${qq.meaning ? `<div class="gloss" style="text-align:center">${esc(qq.meaning)}</div>` : ""}
                <div class="note" style="text-align:center">matched your spelling "${esc(v)}" · ${esc(f.entry_count)} word(s) from this root${qq.occurrence_count ? " · appears " + esc(qq.occurrence_count) + "× in the Quran" : ""}</div>
              </div>`;
              html += f.entries.length
                ? f.entries.map(e => wordCard(e, { tapword: true, quran: false })).join("")
                : `<span class="rootchip" data-root="${esc(f.root)}">جذر ${esc(f.root)} — open the full family</span>`;
            }
          }
        } catch (e2) { /* transliteration is best-effort */ }
      }
      let data = null;
      try { data = await api(`/v1/dictionary/search?q=${encodeURIComponent(v)}`); }
      catch (e3) {
        if (translitDone) { data = null; } else { throw e3; }
      }
      if (!data) {
        $("#results").innerHTML = html + `<div class="note" style="text-align:center;margin-top:12px">English gloss search unavailable offline — Arabic matches above are from your cache</div>`;
        wireCards($("#results"));
        return;
      }
      const seen = new Set();
      const glossResults = (data.results || []).filter(e => { const k = e.word + "|" + (e.gloss_en || ""); if (seen.has(k)) return false; seen.add(k); return true; });
      if (glossResults.length) {
        html += (translitDone ? `<p class="seclabel">ALSO — "${esc(v)}" IN ENGLISH GLOSSES</p>` : `<p class="note" style="text-align:left">${data.count} entr${data.count === 1 ? "y" : "ies"} for "${esc(v)}"</p>`);
        html += glossResults.map(e => wordCard(e, { tapword: true })).join("");
      }
      $("#results").innerHTML = html || `<div class="empty">No entry found for "${esc(v)}".<br>Try an English meaning, an Arabic word, a romanized<br>spelling (sabr, kitab, rahma), or browse the Roots tab.</div>`;
      wireCards($("#results"));
    } catch (e) {
      $("#results").innerHTML = `<div class="empty">Search failed: ${esc(e.message)}<br><span style="font-size:11.5px">Starred words and flashcards still work offline in My Words.</span></div>`;
    }
  };
  $("#go").addEventListener("click", run);
  q.addEventListener("keydown", e => { if (e.key === "Enter") run(); });
  q.focus();
  loadWotd();
}

async function loadWotd() {
  const el = $("#wotd");
  try {
    const roots = await api("/v1/dictionary/roots");
    const epochDay = Math.floor(Date.now() / 86400000);
    const root = roots.roots[Math.abs(epochDay) % roots.roots.length].root;
    const fam = await api(`/v1/dictionary/root/${encodeURIComponent(root)}`);
    const e = fam.entries[0];
    el.innerHTML = `<button class="speak" data-say="${esc(e.word)}" title="Listen">🔊</button><div class="wotd-label">📖 WORD OF THE DAY · root ${esc(fam.root)}</div>
      <div class="ar" style="margin-top:8px">${esc(e.word)}<span class="pos">${esc(e.pos || "")}</span></div>
      <div class="gloss">${esc(e.gloss_en || "")}</div>
      <div class="note">A new word every day — star it to add it to your study deck</div>
      <span class="rootchip" data-root="${esc(fam.root)}">جذر ${esc(fam.root)} — see the whole family</span>`;
    wireCards(el);
  } catch (e) { el.innerHTML = `<div class="note">Word of the day unavailable offline</div>`; }
}

// ---- BROWSE TAB: every word, alif -> yaa ----
let browseLetter = "\u0627"; // start on alif
let browseWords = [];
let browseTotal = -1;

async function renderBrowse() {
  const el = $("#content");
  browseWords = [];
  browseTotal = -1;
  el.innerHTML = `
    <p class="note" style="margin-top:10px">Every dictionary word, alif &rarr; yaa — tap a word for all its senses</p>
    <div class="alphabet">${AR_ALPHABET.map(L => `<button class="lchip ${browseLetter === L ? "on" : ""}" data-bl="${L}">${L}</button>`).join("")}</div>
    <div id="blist"><div class="loading">…</div></div>`;
  el.querySelectorAll("[data-bl]").forEach(b => b.addEventListener("click", () => {
    browseLetter = b.dataset.bl;
    browseWords = [];
    browseTotal = -1;
    el.querySelectorAll("[data-bl]").forEach(x => x.classList.toggle("on", x.dataset.bl === browseLetter));
    $("#blist").innerHTML = `<div class="loading">…</div>`;
    loadBrowseMore();
  }));
  loadBrowseMore();
}

async function loadBrowseMore() {
  const el = $("#blist");
  try {
    const d = await api(`/v1/dictionary/words?letter=${encodeURIComponent(browseLetter)}&limit=50&offset=${browseWords.length}`);
    browseWords = browseWords.concat(d.words || []);
    browseTotal = d.total;
    if (!browseWords.length) {
      el.innerHTML = `<div class="empty">No words start with ${esc(browseLetter)}.</div>`;
      return;
    }
    el.innerHTML = browseWords.map(e => wordCard(e, { tapword: true, quran: false })).join("") +
      `<p class="note" style="text-align:center">${browseWords.length} of ${browseTotal} words starting with ${esc(browseLetter)}</p>` +
      (browseWords.length < browseTotal ? `<div style="text-align:center;margin:14px"><button class="btn ghost" id="bmore">Show more (${browseTotal - browseWords.length} left)</button></div>` : "");
    wireCards(el);
    const m = $("#bmore"); if (m) m.addEventListener("click", loadBrowseMore);
  } catch (e) {
    el.innerHTML = `<div class="empty">Could not load words: ${esc(e.message)}</div>`;
  }
}

// ---- ROOTS TAB ----
const AR_ALPHABET = ["\u0627","\u0628","\u062A","\u062B","\u062C","\u062D","\u062E","\u062F","\u0630","\u0631","\u0632","\u0633","\u0634","\u0635","\u0636","\u0637","\u0638","\u0639","\u063A","\u0641","\u0642","\u0643","\u0644","\u0645","\u0646","\u0647","\u0648","\u064A"];
let rootsLetter = "ALL";
function rootFirstLetter(root) {
  const bare = String(root || "").replace(AR_STRIP, "").replace(/\u0640/g, "").replace(/\s/g, "");
  const c = bare[0] || "";
  return "\u0623\u0625\u0622\u0671".includes(c) ? "\u0627" : c; // hamza-on-alif forms group under ا
}
async function renderRoots() {
  const el = $("#content");
  el.innerHTML = `<div class="searchbar"><input id="rq" aria-label="Filter roots" placeholder="Filter roots by meaning — e.g. mercy, knowledge" /><button class="btn" id="rgo">Filter</button></div>
    <p class="note" style="margin-top:10px">Loading roots…</p>`;
  try {
    const data = await api("/v1/roots");
    let shown = 100;
    const draw = () => {
      const f = ($("#rq").value || "").trim().toLowerCase();
      let list = f ? data.filter(r => (r.meaning || "").toLowerCase().includes(f) || r.root_arabic.includes(f) || rootSkeletonLat(r.root_arabic).startsWith(latSkeleton(f))) : data.slice();
      if (rootsLetter !== "ALL") {
        list = list.filter(r => rootFirstLetter(r.root_arabic) === rootsLetter);
        list.sort((a, b) => String(a.root_arabic).localeCompare(String(b.root_arabic), "ar"));
      }
      const items = list.slice(0, shown).map(r => `
        <button class="rchip" data-root="${esc(r.root_arabic)}">
          <span class="ra">${esc(r.root_arabic)} <span style="opacity:.6;font-size:12px">(${esc(r.occurrence_count)})</span></span>
          <span class="rm">${esc((r.meaning || "root meaning not recorded").split(/[,.]/)[0] + (r.meaning ? "…" : ""))}</span>
        </button>`).join("");
      const strip = `<div class="alphabet">${["ALL"].concat(AR_ALPHABET).map(L => `<button class="lchip ${rootsLetter === L ? "on" : ""}" data-l="${L}">${L === "ALL" ? "All" : L}</button>`).join("")}</div>`;
      el.innerHTML = `<div class="searchbar"><input id="rq" value="${esc($("#rq") ? $("#rq").value : "")}" placeholder="Filter roots by meaning — e.g. mercy, knowledge" /><button class="btn" id="rgo">Filter</button></div>
        <p class="note" style="margin-top:10px">Browse alif &rarr; yaa, or filter by meaning</p>
        ${strip}
        <p class="note" style="margin-top:10px">${f ? list.length + " matching" : rootsLetter !== "ALL" ? list.length + " root(s) starting with " + rootsLetter : data.length + " Quranic roots"} — tap one for its word family${f || rootsLetter !== "ALL" ? "" : ", most frequent first"}</p>
        <div class="rootsgrid">${items}</div>
        ${shown < list.length ? `<div style="text-align:center;margin:14px"><button class="btn ghost" id="rmore">Show more (${list.length - shown} left)</button></div>` : ""}`;
      $("#rgo").addEventListener("click", draw);
      $("#rq").addEventListener("keydown", e => { if (e.key === "Enter") draw(); });
      const m = $("#rmore"); if (m) m.addEventListener("click", () => { shown += 200; draw(); });
      el.querySelectorAll("[data-l]").forEach(b => b.addEventListener("click", () => { rootsLetter = b.dataset.l; shown = 100; draw(); }));
      wireCards(el);
    };
    draw();
  } catch (e) { el.innerHTML = `<div class="empty">Could not load roots: ${esc(e.message)}</div>`; }
}

function renderWords() {
  const el = $("#content");
  const ws = myWords();
  if (ws.length === 0) {
    el.innerHTML = `<div class="empty">Your vocabulary book is empty.<br>Star ☆ any word while searching or browsing roots<br>and it will land here as a flashcard.</div>`;
    return;
  }
  const due = dueCount();
  const st = streakGet();
  el.innerHTML = `
    <div class="statsbar">
      <span class="stat"><b>${ws.length}</b> saved</span>
      <span class="stat"><b>${due}</b> due today</span>
      <span class="stat"><b>${st.count > 0 ? "🔥 " + st.count : "—"}</b> day streak</span>
    </div>
    <div class="wordsbar">
      <button class="btn" id="review">Review flashcards${due ? " (" + due + " due)" : ""}</button>
      <button class="btn ghost small" id="export">⬇ Export</button>
      <button class="btn ghost small" id="importBtn">⬆ Import</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none" />
    </div>
    ${ws.map(w => `<div class="card">
      <button class="speak" data-say="${esc(w.word)}" title="Listen">🔊</button>
      <button class="star on" data-star="${esc(w.word)}" data-gloss="${esc(w.gloss)}" data-root="${esc(w.root)}" aria-label="Save to My Words">★</button>
      <div class="ar">${esc(w.word)}</div>
      <div class="gloss">${esc(w.gloss)}</div>
      ${w.root ? `<span class="rootchip" data-root="${esc(w.root)}">جذر ${esc(w.root)}</span>` : ""}
      ${srsChips(w.word)}
    </div>`).join("")}
    <p class="note">Star a word again to remove it · review daily to grow your streak</p>`;
  $("#review").addEventListener("click", () => review(buildQueue()));
  $("#export").addEventListener("click", exportDeck);
  $("#importBtn").addEventListener("click", () => $("#importFile").click());
  $("#importFile").addEventListener("change", importDeck);
  wireCards(el);
}

function buildQueue() {
  // due words first, then words never studied, then the rest
  const ws = myWords();
  const srs = srsAll();
  const due = [], fresh = [], later = [];
  for (const w of ws) {
    const s = srs[w.word];
    if (!s || !s.seen) fresh.push(w);
    else if (s.due <= Date.now()) due.push(w);
    else later.push(w);
  }
  due.sort((a, b) => srs[a.word].due - srs[b.word].due);
  return due.concat(fresh).concat(later);
}

function exportDeck() {
  const payload = {
    app: "ilm-dictionary", version: 1, exported: new Date().toISOString(),
    words: myWords(), srs: srsAll(), streak: streakGet()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const d = new Date().toISOString().slice(0, 10);
  a.download = `ilm-dictionary-backup-${d}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function importDeck(ev) {
  const f = ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const p = JSON.parse(r.result);
      if (!Array.isArray(p.words)) throw new Error("Not an Ilm Dictionary backup file");
      const ws = myWords();
      const by = new Map(ws.map(w => [w.word, w]));
      for (const w of p.words) {
        const cur = by.get(w.word);
        if (!cur || (w.added || 0) > (cur.added || 0)) by.set(w.word, w);
      }
      localStorage.setItem(WORDS_KEY, JSON.stringify([...by.values()]));
      if (p.srs) {
        const srs = srsAll();
        for (const [k, v] of Object.entries(p.srs)) srs[k] = v;
        localStorage.setItem(SRS_KEY, JSON.stringify(srs));
      }
      renderWords();
    } catch (e) {
      alert("Import failed: " + e.message);
    }
    ev.target.value = "";
  };
  r.readAsText(f);
}

function review(queue, total) {
  total = total || queue.length;
  if (queue.length === 0) {
    const st = streakBump();
    $("#content").innerHTML = `<div class="empty">Session complete — ${total} card${total === 1 ? "" : "s"} reviewed.<br>🔥 ${st.count}-day review streak — keep it alive!<br>May Allah increase you in knowledge.</div><div style="text-align:center;margin:14px"><button class="btn ghost" id="againAll">Back to My Words</button></div>`;
    $("#againAll").addEventListener("click", renderWords);
    return;
  }
  const w = queue[0];
  const fresh = srsAll()[w.word] === undefined || !srsAll()[w.word].seen;
  $("#content").innerHTML = `
    <p class="note" style="text-align:center">${total - queue.length + 1} / ${total}${fresh ? " · new word" : ""} · <button class="speak" data-say="${esc(w.word)}" style="float:none;font-size:15px;vertical-align:middle" title="Listen">🔊 listen</button></p>
    <div class="card flip" id="fc" style="min-height:200px;display:flex;align-items:center">
      <div class="flip-inner" style="width:100%;min-height:170px">
        <div class="flip-face" style="display:flex;align-items:center;justify-content:center"><div class="ar" style="font-size:40px">${esc(w.word)}</div></div>
        <div class="flip-back card" style="border:none"><div><div class="gloss">${esc(w.gloss)}</div>${w.root ? `<div class="note">جذر ${esc(w.root)}</div>` : ""}</div></div>
      </div>
    </div>
    <p class="note" style="text-align:center">Tap the card to see the meaning</p>
    <div class="revbtns">
      <button class="btn ghost" id="rAgain">↻ Again</button>
      <button class="btn" id="rKnow">✓ Know it</button>
    </div>`;
  const fc = $("#fc");
  fc.addEventListener("click", () => fc.classList.toggle("flipped"));
  wireCards($("#content"));
  $("#rKnow").addEventListener("click", () => { srsRecord(w.word, true); review(queue.slice(1), total); });
  $("#rAgain").addEventListener("click", () => { srsRecord(w.word, false); review(queue.slice(1).concat([w]), total); });
}

// ---- tabs ----
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  tab = b.dataset.tab;
  if (tab === "search") renderSearch();
  else if (tab === "roots") renderRoots();
  else if (tab === "browse") renderBrowse();
  else renderWords();
}));
(async () => {
  try {
    const saved = await packGet();
    if (saved && saved.words && saved.words.length) PACK = buildIndexes(saved);
  } catch (e) {}
  renderSearch();
})();

// ---- PWA install prompt ----
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  const standalone = matchMedia("(display-mode: standalone)").matches || localStorage.getItem("ildict_noinstall") === "1";
  if (!standalone) $("#installbar").style.display = "flex";
});
$("#ibinstall").addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  $("#installbar").style.display = "none";
});
$("#ibclose").addEventListener("click", () => {
  localStorage.setItem("ildict_noinstall", "1");
  $("#installbar").style.display = "none";
});

// PWA
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
</script>
</body>
</html>
