<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1a18" />
<title>Ilm Dictionary — Arabic for the serious student</title>
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://ilm-api.vercel.app" />
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============ design tokens ============ */
:root {
  --bg: #0b1a18; --bg2: #0e211e;
  --card: #122623; --card2: #16302b; --raise: #1a3833;
  --border: #24423b; --border2: #2f5249;
  --gold: #d9b46a; --gold2: #b8893c; --gold-soft: rgba(217,180,106,.14);
  --text: #f2ecdb; --muted: #92aaa2; --faint: #5f7a72;
  --red: #d96a52; --green: #5fc08e;
  --glass: rgba(11,26,24,.82);
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --nav-h: 74px;
  --radius: 16px;
}
html[data-theme="light"] {
  --bg: #f2efe6; --bg2: #ece8db;
  --card: #ffffff; --card2: #faf7ee; --raise: #f5f1e4;
  --border: #ddd6c2; --border2: #cbc2a6;
  --gold: #a3741f; --gold2: #8a5f14; --gold-soft: rgba(163,116,31,.12);
  --text: #1c2a27; --muted: #5e6f69; --faint: #8b988f;
  --red: #b8502f; --green: #2f7d54;
  --glass: rgba(242,239,230,.85);
  --shadow: 0 10px 28px rgba(60,55,30,.14);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  background-image: radial-gradient(1200px 500px at 50% -140px, var(--gold-soft), transparent 60%);
  color: var(--text); font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh; padding-bottom: calc(var(--nav-h) + 24px);
  transition: background-color .3s, color .3s;
  font-feature-settings: 'ss01';
}
.wrap { max-width: 640px; margin: 0 auto; padding: 0 14px 26px; }

/* ============ top app bar ============ */
.appbar {
  position: sticky; top: 0; z-index: 40;
  background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.appbar-in {
  max-width: 640px; margin: 0 auto; padding: 10px 14px;
  display: flex; align-items: center; gap: 11px;
}
.logomark {
  width: 42px; height: 42px; border-radius: 13px; flex: none;
  background: linear-gradient(145deg, var(--gold), var(--gold2));
  color: #14100a; font-family: 'Amiri', serif; font-weight: 700; font-size: 22px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 14px rgba(184,137,60,.35);
}
.brand { flex: 1; min-width: 0; }
.brand h1 { font-size: 16.5px; font-weight: 800; letter-spacing: .2px; line-height: 1.2; }
.brand .tag { font-size: 10.5px; color: var(--muted); letter-spacing: .4px; margin-top: 1px; }
.iconbtn {
  background: var(--card); border: 1px solid var(--border); color: var(--muted);
  width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex: none;
  transition: transform .15s, color .2s, border-color .2s;
}
.iconbtn:active { transform: scale(.92); }
.iconbtn:hover { color: var(--gold); border-color: var(--border2); }
.iconbtn svg { width: 19px; height: 19px; }

/* ============ bottom navigation ============ */
.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 45;
  display: flex; justify-content: center; gap: 2px;
  background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
}
.tabs button {
  background: none; border: none; cursor: pointer; font-family: inherit;
  color: var(--faint); flex: 1; max-width: 96px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 2px 5px; border-radius: 14px;
  transition: color .2s, background .2s, transform .15s;
}
.tabs button svg { width: 21px; height: 21px; }
.tabs button span { font-size: 10px; font-weight: 600; letter-spacing: .2px; }
.tabs button:active { transform: scale(.92); }
.tabs button.active { color: var(--gold); background: var(--gold-soft); }
@media (min-width: 700px) { .tabs { left: 50%; right: auto; transform: translateX(-50%); width: 640px; border-radius: 18px 18px 0 0; } }

/* ============ shared components ============ */
.searchbar { display: flex; gap: 8px; margin-top: 14px; }
.searchbar .sfield { flex: 1; position: relative; }
.searchbar .sfield svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); pointer-events: none; }
.searchbar input {
  width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text);
  padding: 12px 14px 12px 38px; border-radius: 14px; font-size: 15px; font-family: inherit;
  transition: border-color .2s, box-shadow .2s;
}
.searchbar input::placeholder { color: var(--faint); }
.searchbar input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
.btn {
  background: linear-gradient(145deg, var(--gold), var(--gold2)); color: #14100a;
  border: none; padding: 10px 16px; border-radius: 13px; font-weight: 700; cursor: pointer;
  font-size: 13.5px; font-family: inherit;
  transition: transform .15s, box-shadow .2s, filter .2s;
  box-shadow: 0 3px 12px rgba(184,137,60,.28);
}
.btn:active { transform: scale(.96); }
.btn:hover { filter: brightness(1.06); }
.btn.ghost {
  background: none; border: 1px solid var(--border2); color: var(--gold);
  box-shadow: none;
}
.btn.small { padding: 7px 12px; font-size: 12px; }
.btn:disabled { opacity: .6; pointer-events: none; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 15px 17px; margin-top: 12px;
  transition: border-color .25s, transform .2s, box-shadow .25s;
}
.card:hover { border-color: var(--border2); }
.card:active { transform: scale(.992); }
.ar { font-family: 'Amiri', serif; font-size: 26px; direction: rtl; line-height: 1.9; }
.pos {
  display: inline-block; font-size: 10px; color: var(--gold); font-weight: 700; letter-spacing: 1px;
  background: var(--gold-soft); border-radius: 8px; padding: 2px 9px; margin-left: 8px; vertical-align: middle;
}
.gloss { font-size: 14px; color: var(--text); margin-top: 7px; line-height: 1.6; }
.rootchip {
  display: inline-block; background: var(--gold-soft); color: var(--gold); font-size: 15px;
  padding: 4px 12px; border-radius: 999px; margin-top: 9px; cursor: pointer; font-family: 'Amiri', serif;
  transition: filter .2s, transform .15s;
}
.rootchip:active { transform: scale(.95); }
.rootchip:hover { filter: brightness(1.15); }
.star { float: right; background: none; border: none; color: var(--faint); font-size: 19px; cursor: pointer; padding: 0 2px; transition: transform .15s, color .2s; }
.star:active { transform: scale(1.25); }
.star.on { color: var(--gold); }
.speak { float: right; background: none; border: none; color: var(--muted); cursor: pointer; padding: 3px 6px; transition: color .2s, transform .15s; }
.speak:hover { color: var(--gold); }
.speak:active { transform: scale(.9); }
.speak.loading { opacity: .35; pointer-events: none; animation: ildpulse 1s infinite; }
.speak.playing { color: var(--gold); }
.speak svg { width: 16px; height: 16px; display: block; }
@keyframes ildpulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
.note { color: var(--muted); font-size: 12px; font-style: italic; margin-top: 8px; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 14px; line-height: 1.7; }
.loading {
  text-align: center; color: var(--muted); padding: 26px; font-size: 13.5px;
  animation: ildpulse 1.6s infinite;
}
.seclabel {
  font-size: 10.5px; letter-spacing: 2.5px; color: var(--gold); font-weight: 700;
  margin-top: 18px; display: flex; align-items: center; gap: 10px;
}
.seclabel::after { content: ""; flex: 1; height: 1px; background: var(--border); }
footer { text-align: center; color: var(--faint); font-size: 11px; margin-top: 30px; }
a { color: var(--gold); }

/* ============ stat tiles & chips ============ */
.statsbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.stat {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 10px 15px; font-size: 11px; color: var(--muted); letter-spacing: .5px; text-transform: uppercase;
  transition: border-color .2s;
}
.stat b { color: var(--gold); font-size: 16px; display: block; margin-top: 3px; text-transform: none; letter-spacing: 0; }
.wordsbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.srs { display: flex; gap: 6px; align-items: center; margin-top: 9px; flex-wrap: wrap; }
.srschip { font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 2px 9px; }
.srschip.due { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
.qlink {
  display: inline-block; margin-top: 9px; font-size: 12px; text-decoration: none;
  border: 1px solid var(--border2); border-radius: 999px; padding: 5px 13px;
  transition: border-color .2s, background .2s;
}
.qlink:hover { border-color: var(--gold); background: var(--gold-soft); }
button.qlink { background: transparent; color: inherit; font-family: inherit; cursor: pointer; }

/* ============ roots & browse ============ */
.rootsgrid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.alphabet { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 12px; }
.lchip {
  background: var(--card2); border: 1px solid var(--border); color: var(--text);
  border-radius: 10px; min-width: 32px; height: 32px; padding: 0 6px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  font-family: 'Amiri', serif; font-size: 16px;
  transition: border-color .2s, transform .15s, background .2s;
}
.lchip:hover { border-color: var(--gold); }
.lchip:active { transform: scale(.9); }
.lchip.on { background: linear-gradient(145deg, var(--gold), var(--gold2)); color: #14100a; border-color: transparent; font-weight: 700; }
.rchip {
  background: var(--card2); border: 1px solid var(--border); color: var(--text);
  border-radius: 14px; padding: 10px 13px; cursor: pointer; font-size: 13px; text-align: left;
  display: flex; flex-direction: column; gap: 3px; min-width: 148px; font-family: inherit;
  transition: border-color .2s, transform .15s;
}
.rchip:hover { border-color: var(--gold); }
.rchip:active { transform: scale(.97); }
.rchip .ra { font-family: 'Amiri', serif; font-size: 18px; }
.rchip .rm { font-size: 10.5px; color: var(--muted); white-space: normal; }
.back {
  background: var(--card); border: 1px solid var(--border); color: var(--gold);
  font-size: 13px; cursor: pointer; padding: 8px 14px; border-radius: 999px; font-family: inherit;
  font-weight: 600; margin-top: 14px;
  transition: transform .15s, border-color .2s;
  display: inline-flex; align-items: center; gap: 6px;
}
.back:active { transform: scale(.95); }
.back:hover { border-color: var(--gold); }

/* ============ word of the day ============ */
.wotd-label { font-size: 10.5px; letter-spacing: 2.5px; color: var(--gold); font-weight: 700; }
.wcard {
  text-align: center; position: relative; overflow: hidden;
  background: linear-gradient(160deg, var(--card), var(--card2));
  border-color: var(--border2);
}
.wcard::before {
  content: ""; position: absolute; inset: -60% 30% auto auto; width: 160px; height: 160px;
  background: radial-gradient(circle, var(--gold-soft), transparent 70%); pointer-events: none;
}

/* ============ flashcards ============ */
.flip { perspective: 900px; cursor: pointer; }
.flip-inner { transition: transform .5s; transform-style: preserve-3d; position: relative; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.flip-face { backface-visibility: hidden; }
.flip-back { position: absolute; inset: 0; transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; }
.revbtns { display: flex; gap: 10px; margin-top: 12px; }
.revbtns .btn { flex: 1; padding: 12px; }
#content { min-height: 320px; }

/* ============ Quran tab ============ */
.qstatus {
  display: flex; align-items: center; gap: 12px; margin-top: 14px;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 15px;
}
.qstatus .qic {
  width: 38px; height: 38px; border-radius: 11px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: var(--gold-soft); color: var(--gold);
}
.qstatus .qic svg { width: 19px; height: 19px; }
.qstatus .qtx { flex: 1; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.qstatus .qtx b { color: var(--text); }
.qstatus .qtx .ok { color: var(--green); font-weight: 700; }
.pbarwrap { margin-top: 10px; height: 7px; border-radius: 99px; background: var(--card2); overflow: hidden; }
.pbar { height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg, var(--gold), var(--gold2)); transition: width .3s; }
.resume {
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  background: linear-gradient(145deg, var(--card2), var(--card)); border: 1px solid var(--border2);
  border-radius: var(--radius); padding: 13px 15px; margin-top: 10px;
  transition: transform .15s, border-color .2s;
}
.resume:active { transform: scale(.98); }
.resume:hover { border-color: var(--gold); }
.resume .ric { width: 36px; height: 36px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; background: var(--gold-soft); color: var(--gold); font-size: 16px; }
.resume .rtx { flex: 1; }
.resume .rtx .r1 { font-size: 13px; font-weight: 700; color: var(--gold); letter-spacing: 1.5px; }
.resume .rtx .r2 { font-size: 13.5px; margin-top: 2px; }
.resume .rarr { color: var(--faint); font-size: 18px; }
.srow {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 11px 14px; margin-top: 8px; cursor: pointer;
  transition: border-color .2s, transform .15s;
}
.srow:hover { border-color: var(--border2); }
.srow:active { transform: scale(.98); }
.snum {
  width: 40px; height: 40px; border-radius: 12px; background: var(--card2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--gold); font-weight: 800; font-size: 14px;
  font-family: 'Amiri', serif;
}
.srow .snames { min-width: 0; }
.srow .snames .se { font-size: 14px; font-weight: 600; }
.srow .snames .st { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.srow .smeta { text-align: right; }
.srow .smeta .sa { font-family: 'Amiri', serif; font-size: 19px; color: var(--gold); }
.srow .smeta .sc { font-size: 10.5px; color: var(--faint); margin-top: 2px; }
.markrow {
  background: var(--card2); border: 1px solid var(--border); border-radius: 13px;
  padding: 10px 14px; margin-top: 8px; cursor: pointer; transition: border-color .2s;
}
.markrow:hover { border-color: var(--gold); }
.markrow .mt { font-size: 11px; color: var(--gold); font-weight: 700; letter-spacing: 1px; }
.markrow .ma { font-family: 'Amiri', serif; font-size: 18px; direction: rtl; margin-top: 4px; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ============ Quran reader ============ */
.readerhead {
  text-align: center; margin-top: 16px; padding: 18px 14px 16px;
  background: linear-gradient(170deg, var(--card2), var(--card));
  border: 1px solid var(--border2); border-radius: 20px; position: relative; overflow: hidden;
}
.readerhead::before {
  content: ""; position: absolute; top: 0; left: 20%; right: 20%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.readerhead .rh-ar { font-family: 'Amiri', serif; font-size: 30px; color: var(--gold); }
.readerhead .rh-en { font-size: 13.5px; font-weight: 700; margin-top: 4px; letter-spacing: .3px; }
.readerhead .rh-meta { font-size: 11px; color: var(--muted); margin-top: 5px; letter-spacing: 1px; text-transform: uppercase; }
.bism { text-align: center; font-family: 'Amiri', serif; font-size: 25px; color: var(--gold); margin-top: 20px; line-height: 2; }
.ayah { margin-top: 14px; padding: 13px 15px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--border); transition: border-color .2s; }
.ayah:target, .ayah.flash { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
.ayah .atop { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.ayah .anum { font-size: 10px; color: var(--faint); font-weight: 700; letter-spacing: 1.5px; }
.ayah .atop .abm { margin-left: auto; background: none; border: none; color: var(--faint); font-size: 16px; cursor: pointer; padding: 2px 4px; transition: color .2s, transform .15s; }
.ayah .atop .abm:active { transform: scale(1.2); }
.ayah .atop .abm.on { color: var(--gold); }
.ayah .aar { font-family: 'Amiri', serif; font-size: 24px; direction: rtl; text-align: right; line-height: 2.15; color: var(--text); }
.ayah .atr { font-size: 13.5px; color: var(--muted); margin-top: 9px; line-height: 1.65; }
.aymk {
  display: inline-block; font-family: 'Amiri', serif; font-size: .62em; color: var(--gold);
  border: 1px solid var(--border2); border-radius: 999px; padding: 0 8px; margin: 0 4px;
  vertical-align: middle; white-space: nowrap;
}
.readerfoot { display: flex; gap: 10px; margin: 16px 0 6px; }
.readerfoot .btn { flex: 1; }
.translbl { font-size: 11px; color: var(--faint); text-align: center; margin-top: 14px; letter-spacing: .5px; }

/* ============ install bar & toast ============ */
#installbar {
  position: fixed; bottom: calc(var(--nav-h) + 12px); left: 12px; right: 12px;
  background: var(--raise); border: 1px solid var(--border2); border-radius: 16px;
  padding: 11px 14px; display: none; align-items: center; gap: 10px; z-index: 50;
  box-shadow: var(--shadow); max-width: 616px; margin: 0 auto;
}
#installbar .ibtext { flex: 1; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
#installbar .ibx { background: none; border: none; color: var(--faint); font-size: 15px; cursor: pointer; padding: 4px; }
#toast {
  position: fixed; bottom: calc(var(--nav-h) + 14px); left: 50%; transform: translateX(-50%) translateY(12px);
  background: var(--raise); border: 1px solid var(--border2); color: var(--text);
  font-size: 12.5px; padding: 10px 18px; border-radius: 999px; z-index: 60;
  opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s;
  box-shadow: var(--shadow); max-width: 86vw; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============ entry animation ============ */
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
#content > * { animation: fadeUp .38s cubic-bezier(.2,.7,.3,1) both; }
#content > *:nth-child(2) { animation-delay: .04s; }
#content > *:nth-child(3) { animation-delay: .08s; }
#content > *:nth-child(4) { animation-delay: .12s; }
#content > *:nth-child(5) { animation-delay: .16s; }
#content > *:nth-child(n+6) { animation-delay: .2s; }
@media (prefers-reduced-motion: reduce) {
  #content > *, .card, .btn { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar-in">
    <div class="logomark" aria-hidden="true">علم</div>
    <div class="brand">
      <h1>Ilm Dictionary</h1>
      <div class="tag">Arabic for the serious student</div>
    </div>
    <button class="iconbtn" id="themeBtn" aria-label="Toggle light or dark theme" title="Toggle theme"></button>
  </div>
</header>

<div class="wrap">
  <div id="content"></div>
  <footer>Ilm Dictionary · built on the Ilm API · full Quran + dictionary offline</footer>
</div>

<nav class="tabs" aria-label="Main navigation">
  <button data-tab="search" class="active" aria-label="Search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span>Search</span>
  </button>
  <button data-tab="quran" aria-label="Quran">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 5 8 4.5 5 4.8v12.4c3-.3 5.5.2 7 1.7 1.5-1.5 4-2 7-1.7V4.8c-3-.3-5.5.2-7 1.7Z"/><path d="M12 6.5v12.4"/></svg>
    <span>Quran</span>
  </button>
  <button data-tab="roots" aria-label="Roots">

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[c]));

const SPK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

// ---------- toast ----------

// ---------- theme ----------
const THEME_KEY = "ildict_theme";

// ---------- offline pack: the whole dictionary stored on the device ----------
let PACK = null; // { words, roots, groups, byRoot, rootMeta, byLetter }

function plainAr(w) {
  return String(w || "").replace(/[\u064B-\u065F\u0670\u06D6-\u06DC\u06DF-\u06E8\u06EA-\u06ED\u0640\s-]/g, "");
}
function packNormRoot(r) { return plainAr(r); }

function buildIndexes(p) {
  const groups = new Map(), byRoot = new Map(), byLetter = new Map();
  for (const e of p.words) {
    const pl = plainAr(e.word);
    if (!groups.has(pl)) groups.set(pl, []);
    groups.get(pl).push(e);
    if (e.root) {
      const rk = packNormRoot(e.root);
      if (!byRoot.has(rk)) byRoot.set(rk, []);
      byRoot.get(rk).push(e);
    }
    const ch = pl[0] || "";
    const letter = "\u0627\u0623\u0625\u0622\u0671".includes(ch) ? "\u0627" : ch;
    if (!byLetter.has(letter)) byLetter.set(letter, []);
    byLetter.get(letter).push(e);
  }
  const rootMeta = new Map();
  for (const r of p.roots || []) rootMeta.set(packNormRoot(r.root_arabic), r);
  return { ...p, groups, byRoot, rootMeta, byLetter, total: p.words.length };
}

// serve a dictionary GET from the pack, mirroring the API's response shapes
function localServe(path) {
  const packRootOcc = rk => {
    const m = PACK.rootMeta.get(rk);
    return m && m.occurrence_count ? m.occurrence_count : 0;
  };
  let m;
  if ((m = path.match(/^\/v1\/dictionary\/search\?q=([^&]+)/))) {
    const q = decodeURIComponent(m[1]);
    const isArabic = /[\u0600-\u06FF]/.test(q);
    let results = [];
    if (isArabic) {
      const pl = plainAr(q);
      for (const [k, es] of PACK.groups) {
        if (k === pl || k.startsWith(pl)) results = results.concat(es);
        if (results.length >= 50) break;
      }
    } else {
      for (const e of PACK.words) {
        if ((e.gloss_en || "").toLowerCase().includes(q.toLowerCase())) results.push(e);
        if (results.length >= 50) break;
      }
      return { offlineOnly: true, data: { query: q, language: "en", count: results.length, results } };
    }
    return { data: { query: q, language: isArabic ? "ar" : "en", count: results.length, results } };
  }
  if ((m = path.match(/^\/v1\/dictionary\/word\/(.+)$/))) {
    const w = decodeURIComponent(m[1]);
    const es = PACK.groups.get(plainAr(w)) || [];
    const rk = es.length && es[0].root ? packNormRoot(es[0].root) : "";
    return { data: { word: w, language: "en", quran_occurrences_of_root: rk ? packRootOcc(rk) : 0, entries: es } };
  }
  if ((m = path.match(/^\/v1\/dictionary\/words\?letter=([^&]+)&limit=(\d+)&offset=(\d+)$/))) {
    const letter = decodeURIComponent(m[1]);
    const l = PACK.byLetter.get(letter) || [];
    const off = +m[3], lim = +m[2];
    return { data: { letter, total: l.length, offset: off, limit: lim, words: l.slice(off, off + lim) } };
  }
  if ((m = path.match(/^\/v1\/dictionary\/root\/(.+)$/))) {
    const rk = packNormRoot(decodeURIComponent(m[1]));
    const meta = PACK.rootMeta.get(rk) || {};
    const es = PACK.byRoot.get(rk) || [];
    return { data: { root: meta.root_arabic || decodeURIComponent(m[1]), entry_count: es.length, quranic: { root_arabic: meta.root_arabic, meaning: meta.meaning, occurrence_count: meta.occurrence_count }, entries: es } };
  }
  if (path === "/v1/roots" || path.startsWith("/v1/roots?")) {
    // same shape as the live API: a bare array of roots
    return { data: (PACK.roots || []).map(r => ({ root: r.root_arabic, root_arabic: r.root_arabic, meaning: r.meaning, occurrence_count: r.occurrence_count })) };
  }
  // Word of the Day picks from this list; serving it from the pack keeps the
  // home screen fully usable offline on a fresh day.
  if (path === "/v1/dictionary/roots" || path.startsWith("/v1/dictionary/roots?")) {
    return { data: { count: (PACK.roots || []).length, roots: (PACK.roots || []).map(r => ({ root: r.root_arabic, root_arabic: r.root_arabic, meaning: r.meaning, occurrence_count: r.occurrence_count })) } };
  }
  return null;
}

// IndexedDB helpers — packs are too big for localStorage
function idbOpen(name) {
  return new Promise((res, rej) => {
    const rq = indexedDB.open(name, 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("pack");
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbAction(name, mode, method, value) {
  const db = await idbOpen(name);
  return new Promise((res, rej) => {
    const store = db.transaction("pack", mode).objectStore("pack");
    const t = method === "put" ? store.put(value, "v1") : store[method]("v1");
    t.onsuccess = () => res(t.result);
    t.onerror = () => rej(t.error);
  });
}
const packGet = () => idbAction("ildict-pack", "readonly", "get").catch(() => null);
const packPut = v => idbAction("ildict-pack", "readwrite", "put", v).then(() => v);
const packDel = () => idbAction("ildict-pack", "readwrite", "delete").catch(() => {});

async function downloadPack(onProgress) {
  const ac = new AbortController();
  let stallT = null, stallRej = null;
  const watchdog = new Promise((_, rej) => { stallRej = rej; stallT = setTimeout(() => rej(new Error("the connection stalled, tap Download again")), 20000); });
  const kick = () => { clearTimeout(stallT); stallT = setTimeout(() => stallRej(new Error("the connection stalled, tap Download again")), 20000); };
  try {
  const r = await fetch(API_BASE + "/v1/dictionary/offline", { headers: authHeaders(), signal: ac.signal });
  if (!r.ok) throw new Error("Download failed");
  const total = +(r.headers.get("content-length") || 4800000);
  let got = 0;
  const chunks = [];
  const reader = r.body.getReader();
  for (;;) {
    const { done, value } = await Promise.race([reader.read(), watchdog]);
    if (done) break;
    kick();
    chunks.push(value);
    got += value.length;
    onProgress(Math.min(99, Math.round(got / total * 100)));
  }
  const blob = new Blob(chunks);
  const data = JSON.parse(await blob.text());
  await packPut({ words: data.words, roots: data.roots });
  PACK = buildIndexes({ words: data.words, roots: data.roots });
  return data.words.length;
  } finally {
    clearTimeout(stallT);
    try { ac.abort(); } catch (e) {}
  }
}
const removePack = async () => { await packDel(); PACK = null; };

function offlineCardHTML() {
  if (PACK) return `<div class="qstatus">
    <div class="qic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <span class="qtx"><b style="color:var(--green)">${(PACK.total || 0).toLocaleString()} words saved</b><br>the whole dictionary works offline</span>
    <button class="btn ghost small" id="packDel">Remove</button>
  </div>`;
  return `<div class="qstatus">
    <div class="qic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></div>
    <span class="qtx"><b>Save the whole dictionary</b><br>36,500+ words, ~2 MB, fully offline</span>
    <button class="btn small" id="packDl" style="white-space:nowrap">Download</button>

}
function wireOfflineCard() {
  const d = $("#packDl"), x = $("#packDel");
  if (d) d.addEventListener("click", async () => {
    d.disabled = true;
    const card = d.closest(".qstatus");
    card.innerHTML = `<div class="qic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></div><span class="qtx" id="packStat">Downloading dictionary… 0%</span>`;
    try {
      const n = await downloadPack(p => { const s = $("#packStat"); if (s) s.innerHTML = `<b style="color:var(--green)">Downloading dictionary… ${p}%</b>`; });
      card.innerHTML = `<div class="qic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><span class="qtx"><b style="color:var(--green)">${n.toLocaleString()} words saved</b><br>you are fully offline now</span><button class="btn ghost small" id="packDel">Remove</button>`;
      const xx = $("#packDel");
      if (xx) xx.addEventListener("click", async () => { await removePack(); renderSearch(); });
    } catch (e) {
      card.innerHTML = `<span class="qtx" style="color:var(--red)">Download failed: ${esc(e.message)}</span> <button class="btn small" id="packRetry" style="margin-left:8px">Try again</button>`;
      const rt = $("#packRetry");
      if (rt) rt.addEventListener("click", () => { renderSearch(); const nd = $("#packDl"); if (nd) nd.click(); });
    }
  });
  if (x) x.addEventListener("click", async () => { await removePack(); renderSearch(); });
}

async function api(path) {
  if (PACK) {
    const local = localServe(path);
    if (local && (!local.offlineOnly || !navigator.onLine)) return local.data;
  }
  const r = await fetch(API_BASE + path, { headers: authHeaders() });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Request failed");
  return data;
}

// ---------- transliteration: match romanized queries like "sabr" ----------
const AR_STRIP = /[\u064B-\u0652\u0640\u0670]/g; // harakat, tatweel
const AR_VOWELS = "\u0627\u0623\u0625\u0622\u0648\u064A\u0649\u0624\u0626\u0621"; // alif/hamza forms, waw, ya, alif maqsura
function arSkeleton(w) {
  // consonant skeleton of an Arabic word: diacritics and long vowels removed
  w = String(w || "").replace(AR_STRIP, "").replace(/-/g, "");
  let out = "";
  for (const ch of w) { if (!AR_VOWELS.includes(ch)) out += ch; }
  return out;
}
const AR2LAT = { "\u0621":"'", "\u0622":"a", "\u0623":"'", "\u0625":"i", "\u0626":"y", "\u0624":"w", "\u0627":"a", "\u0628":"b", "\u0629":"h", "\u062A":"t", "\u062B":"th", "\u062C":"j", "\u062D":"h", "\u062E":"kh", "\u062F":"d", "\u0630":"dh", "\u0631":"r", "\u0632":"z", "\u0633":"s", "\u0634":"sh", "\u0635":"s", "\u0636":"d", "\u0637":"t", "\u0638":"z", "\u0639":"'", "\u063A":"gh", "\u0640":"", "\u0641":"f", "\u0642":"q", "\u0643":"k", "\u0644":"l", "\u0645":"m", "\u0646":"n", "\u0647":"h", "\u0648":"w", "\u0649":"a", "\u064A":"y" };
function latSkeleton(q) {
  // consonant skeleton of a romanized query: digraphs first, vowels dropped
  q = String(q || "").toLowerCase().trim().replace(/[^a-z]/g, "");
  let out = "";
  for (let i = 0; i < q.length; i++) {
    const two = q.slice(i, i + 2);
    if (["th","kh","dh","sh","gh"].includes(two)) { out += two; i++; continue; }
    const c = q[i];
    if (!"aeiou".includes(c)) out += c;
  }
  return out;
}
const ROOTS_CACHE_KEY = "ildict_roots_cache";
const asRootsArray = d => Array.isArray(d) ? d : (d && Array.isArray(d.roots)) ? d.roots : [];
async function getRootsCached() {
  try {
    const c = JSON.parse(localStorage.getItem(ROOTS_CACHE_KEY) || "null");
    if (c && Date.now() - c.t < 7 * 86400000) {
      const cached = asRootsArray(c.data);
      if (cached.length) return cached;
    }
  } catch (e) {}
  const data = asRootsArray(await api("/v1/roots"));
  try { localStorage.setItem(ROOTS_CACHE_KEY, JSON.stringify({ t: Date.now(), data })); } catch (e) {}
  return data;
}
function normLat(sk) { return sk.replace(/^'+/, "").replace(/[wy]/g, "").replace(/h+$/, ""); }
function rootSkeletonLat(root) {
  const sk = arSkeleton(root);
  if (!sk) return "";
  return normLat([...sk].map(c => AR2LAT[c] !== undefined ? AR2LAT[c] : c).join(""));
}
async function translitLookup(q) {
  const sk = latSkeleton(q);
  if (!sk) return [];
  const roots = await getRootsCached();
  const withSk = roots.map(r => ({ r, rsk: rootSkeletonLat(r.root_arabic) })).filter(x => x.rsk);
  // exact skeleton match (handles ta marbuta "h", weak letters, ayn)
  let hits = withSk.filter(x => x.rsk === normLat(sk)).map(x => x.r);
  // prefix/suffix forms: "muslim" contains root slm, "istaqam" contains qm
  if (hits.length === 0) {
    hits = withSk.filter(x => x.rsk.length >= 2 && sk.includes(x.rsk)).map(x => x.r);
  }
  if (hits.length === 0) return [];
  const families = await Promise.all(hits.slice(0, 3).map(r => api(`/v1/dictionary/root/${encodeURIComponent(r.root_arabic)}`).catch(() => null)));
  return hits.slice(0, 3).map((r, i) => {
    const f = families[i];
    if (f) return { root: f.root, entry_count: f.entry_count, quranic: f.quranic || {}, entries: (f.entries || []).slice(0, 12) };
    // offline / never opened: still show the matched root from the cached root list
    return { root: r.root_arabic, entry_count: 0, quranic: { meaning: r.meaning || "", occurrence_count: r.occurrence_count || 0 }, entries: [] };
  });
}

// ---------- audio pronunciation ----------
const API_BASE = "https://ilm-api.vercel.app/web";
const AUDIO_CACHE = new Map(); // word -> object URL of the fetched MP3
let currentAudio = null;
let arVoice = null;

// Real recorded-style pronunciation from the Ilm API; falls back to the
// browser's built-in Arabic voice when offline or on error.
async function playWord(word, btn) {
  const w = String(word || "").trim();
  if (!w) return;
  if (currentAudio) { currentAudio.pause(); if (currentAudio._btn) currentAudio._btn.classList.remove("playing"); currentAudio = null; }
  try { speechSynthesis.cancel(); } catch (e) {}
  let url = AUDIO_CACHE.get(w);
  if (!url) {
    if (btn) btn.classList.add("loading");
    try {
      const r = await fetch(API_BASE + "/v1/dictionary/audio?word=" + encodeURIComponent(w), { headers: authHeaders() });
      if (!r.ok) throw new Error("HTTP " + r.status);
      url = URL.createObjectURL(await r.blob());
      AUDIO_CACHE.set(w, url);
    } catch (e) {
      speak(w); // graceful fallback: device TTS
    } finally {
      if (btn) btn.classList.remove("loading");
    }
    if (!url) return;
  }
  const a = new Audio(url);
  a._btn = btn;
  if (btn) btn.classList.add("playing");
  a.onended = () => { if (btn) btn.classList.remove("playing"); if (currentAudio === a) currentAudio = null; };
  a.onerror = () => { if (btn) btn.classList.remove("playing"); if (currentAudio === a) currentAudio = null; speak(w); };
  currentAudio = a;
  a.play();
}

function speak(word) {
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(String(word).replace(AR_STRIP, ""));
  u.lang = "ar-SA";
  if (!arVoice) {
    const vs = speechSynthesis.getVoices();
    arVoice = vs.find(v => /^ar/i.test(v.lang)) || null;
  }
  if (arVoice) u.voice = arVoice;
  u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => { arVoice = null; };

// ---------- my words (vocabulary book) ----------
const WORDS_KEY = "ildict_words";
const myWords = () => JSON.parse(localStorage.getItem(WORDS_KEY) || "[]");
function isStarred(w) { return myWords().some(m => m.word === w); }
function toggleStar(word, gloss, root) {
  let ws = myWords();
  const ix = ws.findIndex(m => m.word === word);
  if (ix >= 0) ws.splice(ix, 1); else ws.unshift({ word, gloss: (gloss || "").slice(0, 300), root: root || "", added: Date.now() });
  localStorage.setItem(WORDS_KEY, JSON.stringify(ws));
  return ix < 0;
}

// ---------- spaced repetition (SRS) ----------
const SRS_KEY = "ildict_srs";
const STREAK_KEY = "ildict_streak";
const SRS_INTERVALS = [1, 2, 4, 7, 15, 30, 60]; // days
const srsAll = () => JSON.parse(localStorage.getItem(SRS_KEY) || "{}");
const dayMs = 86400000;
const srsDue = w => { const s = srsAll()[w]; return !s || s.due <= Date.now(); };
function srsRecord(word, knew) {
  const all = srsAll();
  const s = all[word] || { level: 0, due: 0 };
  s.level = knew ? Math.min((s.level || 0) + 1, SRS_INTERVALS.length - 1) : 0;
  s.due = knew ? Date.now() + SRS_INTERVALS[s.level] * dayMs : Date.now();
  s.seen = Date.now();
  all[word] = s;
  localStorage.setItem(SRS_KEY, JSON.stringify(all));
}
function dueCount() { return myWords().filter(w => srsDue(w.word)).length; }
function streakBump() {
  const st = JSON.parse(localStorage.getItem(STREAK_KEY) || '{"count":0,"last":""}');
  const today = new Date().toDateString();
  if (st.last === today) return st;
  const yest = new Date(Date.now() - dayMs).toDateString();
  st.count = st.last === yest ? st.count + 1 : 1;
  st.last = today;
  localStorage.setItem(STREAK_KEY, JSON.stringify(st));
  return st;
}
const streakGet = () => JSON.parse(localStorage.getItem(STREAK_KEY) || '{"count":0,"last":""}');

// ---------- views ----------
let tab = "search";

function srsChips(word) {
  const s = srsAll()[word];
  if (!s || !s.level) return "";
  const days = Math.max(0, Math.ceil((s.due - Date.now()) / dayMs));
  return `<div class="srs"><span class="srschip">✓ known ×${s.level}</span><span class="srschip ${days === 0 ? "due" : ""}">${days === 0 ? "due for review" : "reviews in " + days + "d"}</span></div>`;
}

function wordCard(e, opts = {}) {
  const starred = isStarred(e.word);
  return `<div class="card" ${opts.tapword ? `data-w="${esc(e.word)}"` : ""}>
    <button class="speak" data-say="${esc(e.word)}" title="Listen">${SPK_SVG}</button>
    <button class="star ${starred ? "on" : ""}" data-star="${esc(e.word)}" data-gloss="${esc((e.gloss_en||"").slice(0,120))}" data-root="${esc(e.root||"")}">${starred ? "★" : "☆"}</button>
    <div class="ar">${esc(e.word)}<span class="pos">${esc(e.pos || "")}</span></div>

function wireCards(scope) {

async function renderSearch() {
  const el = $("#content");
  el.innerHTML = `
    <div class="searchbar"><div class="sfield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" aria-label="Search words" placeholder="English, Arabic or romanized — patience, صبر, sabr" /></div><button class="btn" id="go">Search</button></div>
    <div id="offlineCard">${offlineCardHTML()}</div>
    <div class="card wcard" id="wotd"><div class="wotd-label">WORD OF THE DAY</div><div class="loading">…</div></div>
    <div id="results"></div>`;
  wireOfflineCard();
  const q = $("#q");
  const run = async () => {
    const v = q.value.trim();
    if (!v) return;
    $("#results").innerHTML = `<div class="loading">Searching…</div>`;
    const isArabic = /[\u0600-\u06FF]/.test(v);
    try {
      let html = "", translitDone = false;
      // transliteration matches (romanized queries) — best signal, shown first
      if (!isArabic) {
        try {
          const fams = await translitLookup(v);
          if (fams.length) {
            translitDone = true;
            html += `<p class="seclabel">ARABIC MATCHES FOR "${esc(v.toUpperCase())}"</p>`;
            for (const f of fams) {
              const qq = f.quranic || {};
              html += `<div class="card">
                <div class="ar" style="font-size:32px;text-align:center">${esc(f.root)}</div>
                ${qq.meaning ? `<div class="gloss" style="text-align:center">${esc(qq.meaning)}</div>` : ""}
                <div class="note" style="text-align:center">matched your spelling "${esc(v)}" · ${esc(f.entry_count)} word(s) from this root${qq.occurrence_count ? " · appears " + esc(qq.occurrence_count) + "× in the Quran" : ""}</div>
              </div>`;
              html += f.entries.length
                ? f.entries.map(e => wordCard(e, { tapword: true, quran: false })).join("")
                : `<span class="rootchip" data-root="${esc(f.root)}">جذر ${esc(f.root)} — open the full family</span>`;
            }
          }
        } catch (e2) { /* transliteration is best-effort */ }
      }
      let data = null;
      try { data = await api(`/v1/dictionary/search?q=${encodeURIComponent(v)}`); }
      catch (e3) {
        if (translitDone) { data = null; } else { throw e3; }
      }
      if (!data) {
        $("#results").innerHTML = html + `<div class="note" style="text-align:center;margin-top:12px">English gloss search unavailable offline — Arabic matches above are from your cache</div>`;
        wireCards($("#results"));
        return;
      }
      const seen = new Set();
      const glossResults = (data.results || []).filter(e => { const k = e.word + "|" + (e.gloss_en || ""); if (seen.has(k)) return false; seen.add(k); return true; });
      if (glossResults.length) {
        html += (translitDone ? `<p class="seclabel">ALSO — "${esc(v)}" IN ENGLISH GLOSSES</p>` : `<p class="seclabel" style="margin-top:14px">${data.count} ENTR${data.count === 1 ? "Y" : "IES"} FOR "${esc(v)}"</p>`);
        html += glossResults.map(e => wordCard(e, { tapword: true })).join("");
      }
      $("#results").innerHTML = html || `<div class="empty">No entry found for "${esc(v)}".<br>Try an English meaning, an Arabic word, a romanized<br>spelling (sabr, kitab, rahma), or browse the Roots tab.</div>`;
      wireCards($("#results"));
    } catch (e) {
      $("#results").innerHTML = `<div class="empty">Search failed: ${esc(e.message)}<br><span style="font-size:11.5px">Starred words and flashcards still work offline in My Words.</span></div>`;
    }
  };
  $("#go").addEventListener("click", run);
  q.addEventListener("keydown", e => { if (e.key === "Enter") run(); });
  q.focus();
  loadWotd();
}

function buildQueue() {
  // due words first, then words never studied, then the rest
  const ws = myWords();
  const srs = srsAll();
  const due = [], fresh = [], later = [];
  for (const w of ws) {
    const s = srs[w.word];
    if (!s || !s.seen) fresh.push(w);
    else if (s.due <= Date.now()) due.push(w);
    else later.push(w);
  }
  due.sort((a, b) => srs[a.word].due - srs[b.word].due);
  return due.concat(fresh).concat(later);
}

function exportDeck() {
  const payload = {
    app: "ilm-dictionary", version: 1, exported: new Date().toISOString(),
    words: myWords(), srs: srsAll(), streak: streakGet()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  const d = new Date().toISOString().slice(0, 10);
  a.download = `ilm-dictionary-backup-${d}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function importDeck(ev) {
  const f = ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const p = JSON.parse(r.result);
      if (!Array.isArray(p.words)) throw new Error("Not an Ilm Dictionary backup file");
      const ws = myWords();
      const by = new Map(ws.map(w => [w.word, w]));
      for (const w of p.words) {
        const cur = by.get(w.word);
        if (!cur || (w.added || 0) > (cur.added || 0)) by.set(w.word, w);
      }
      localStorage.setItem(WORDS_KEY, JSON.stringify([...by.values()]));
      if (p.srs) {
        const srs = srsAll();
        for (const [k, v] of Object.entries(p.srs)) srs[k] = v;
        localStorage.setItem(SRS_KEY, JSON.stringify(srs));
      }
      renderWords();
    } catch (e) {
      alert("Import failed: " + e.message);
    }
    ev.target.value = "";
  };
  r.readAsText(f);
}

const QURAN_DB = "ildict-quran";
const QCHECK_KEY = "ildict_quran_check";
const QREMOVED_KEY = "ildict_quran_removed";
const LAST_READ_KEY = "ildict_last_read";
const AYAH_MARKS_KEY = "ildict_ayah_marks";
const SURAH_LIST_CACHE = "ildict_surah_list";
let QPACK = null;          // { downloaded, translation_code, surahs }
let quranBusy = false;     // a download is in progress
let quranProgress = -1;     // -1 = idle, else 0-99

const quranGet = () => idbAction(QURAN_DB, "readonly", "get").catch(() => null);
const quranPut = v => idbAction(QURAN_DB, "readwrite", "put", v).then(() => v);
const quranDel = () => idbAction(QURAN_DB, "readwrite", "delete").catch(() => {});

// a pack is complete when all 114 suras exist and every one has its full ayah set
function quranComplete(p) {
  return !!(p && Array.isArray(p.surahs) && p.surahs.length === 114 &&
    p.surahs.every(s => s && Array.isArray(s.ayahs) && s.ayahs.length === s.ayah_count));
}

async function downloadQuran(onProgress) {
  quranBusy = true;
  const ac = new AbortController();
  let stallT = null, stallRej = null;
  const watchdog = new Promise((_, rej) => { stallRej = rej; stallT = setTimeout(() => rej(new Error("the connection stalled, try again later")), 20000); });
  const kick = () => { clearTimeout(stallT); stallT = setTimeout(() => stallRej(new Error("the connection stalled, try again later")), 20000); };
  try {
    const r = await fetch(API_BASE + "/v1/quran/offline?translation=en.sahih", { headers: authHeaders(), signal: ac.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const total = +(r.headers.get("content-length") || 2300000);
    let got = 0;
    const chunks = [];
    const reader = r.body.getReader();
    for (;;) {
      const { done, value } = await Promise.race([reader.read(), watchdog]);
      if (done) break;
      kick();
      chunks.push(value);
      got += value.length;
      onProgress(Math.min(99, Math.round(got / total * 100)));
    }
    const data = JSON.parse(await new Blob(chunks).text());
    if (data.surah_count !== 114) throw new Error("incomplete pack received");
    QPACK = { downloaded: new Date().toISOString(), translation_code: data.translation_code || "en.sahih", surahs: data.surahs };
    await quranPut(QPACK);
    localStorage.removeItem(QREMOVED_KEY);
    return data.surahs;
  } finally {
    clearTimeout(stallT);
    try { ac.abort(); } catch (e) {}
    quranBusy = false;
    quranProgress = -1;
  }
}

// daily integrity check: once per day, verify every single sura is saved offline.
// If anything is missing, silently re-download the whole Quran in the background.
async function quranDailyCheck() {
  const today = new Date().toDateString();
  if (localStorage.getItem(QCHECK_KEY) === today) return; // already verified today
  if (!navigator.onLine) return; // offline: don't burn today's check, retry when online
  let p = QPACK;
  if (!p) p = await quranGet();
  if (quranComplete(p)) { QPACK = p; localStorage.setItem(QCHECK_KEY, today); return; }
  if (localStorage.getItem(QREMOVED_KEY) === "1") { localStorage.setItem(QCHECK_KEY, today); return; } // removed on purpose
  try {
    toast("Checking your offline Quran…");
    await downloadQuran(p2 => { quranProgress = p2; });
    localStorage.setItem(QCHECK_KEY, today);
    toast("All 114 suras are saved for offline reading");
  } catch (e) { /* not marked: retries on the next open */ }
}

const ayahMarks = () => JSON.parse(localStorage.getItem(AYAH_MARKS_KEY) || "[]");
function toggleAyahMark(s, a, ar, tr) {
  const ms = ayahMarks();
  const ix = ms.findIndex(m => m.s === s && m.a === a);
  if (ix >= 0) ms.splice(ix, 1);
  else ms.unshift({ s, a, ar: (ar || "").slice(0, 220), tr: (tr || "").slice(0, 140), t: Date.now() });
  localStorage.setItem(AYAH_MARKS_KEY, JSON.stringify(ms));
  return ix < 0;
}
const lastRead = () => { try { return JSON.parse(localStorage.getItem(LAST_READ_KEY) || "null"); } catch (e) { return null; } };

const AR_DIGITS = "٠١٢٣٤٥٦٧٨٩";
const arNum = n => String(n).replace(/\d/g, d => AR_DIGITS[d]);
const BASMALAH = "\u0628\u0650\u0633\u0652\u0645\u0650 \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0671\u0644\u0631\u0651\u064E\u062D\u0652\u0645\u064E\u0670\u0646\u0650 \u0671\u0644\u0631\u0651\u064E\u062D\u0650\u064A\u0645\u0650";

// some editions embed the basmalah in ayah 1; show it as an ornamental header instead
function splitBasmalah(surah, ayahs) {
  if (surah === 1 || surah === 9 || !ayahs.length) return { header: null, ayahs };
  const norm = w => String(w || "").replace(/\uFEFF/g, "").replace(AR_STRIP, "").replace(/\u0670|\u0640|\s/g, "");
  const first = String(ayahs[0][1] || "");
  const bare = norm(first);
  if (bare.startsWith(norm(BASMALAH))) {
    const cut = BASMALAH.length + (first.length - bare.length > 8 ? 2 : 0);
    const rest = first.slice(BASMALAH.length).trim().replace(/^\u0651|\u0651$/, "");
    const cloned = ayahs.slice();
    if (rest && norm(rest)) cloned[0] = [ayahs[0][0], rest, ayahs[0][2]];
    else cloned.shift();
    return { header: BASMALAH, ayahs: cloned };
  }
  return { header: null, ayahs };
}

async function playAyah(s, a, btn) {
  if (!navigator.onLine) { toast("Recitation needs a connection — the text is offline"); return; }
  if (currentAudio) { currentAudio.pause(); if (currentAudio._btn) currentAudio._btn.classList.remove("playing"); currentAudio = null; }
  if (btn) btn.classList.add("loading");
  try {
    const d = await api(`/v1/quran/${s}/${a}/audio`);
    const au = new Audio(d.audio_url);
    au._btn = btn;
    if (btn) { btn.classList.remove("loading"); btn.classList.add("playing"); }
    au.onended = () => { if (btn) btn.classList.remove("playing"); };
    au.onerror = () => { if (btn) btn.classList.remove("playing"); toast("Could not load recitation"); };
    currentAudio = au;
    au.play();
  } catch (e) {
    if (btn) btn.classList.remove("loading");
    toast("Could not load recitation");
  }
}

async function getSurahList() {
  if (quranComplete(QPACK)) return QPACK.surahs.map(s => ({ number: s.number, name_arabic: s.name_arabic, name_english: s.name_english, name_transliteration: s.name_transliteration, revelation_place: s.revelation_place, ayah_count: s.ayah_count }));
  try {
    const c = JSON.parse(localStorage.getItem(SURAH_LIST_CACHE) || "null");
    if (c && Array.isArray(c) && c.length === 114) return c;
  } catch (e) {}
  const data = await api("/v1/quran/surahs");
  try { localStorage.setItem(SURAH_LIST_CACHE, JSON.stringify(data)); } catch (e) {}
  return data;
}

function quranStatusHTML() {
  if (quranBusy) return `<div class="qstatus">
    <div class="qic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></div>
    <span class="qtx"><b>Saving the Quran… ${quranProgress < 0 ? "" : quranProgress + "%"}</b>
    <div class="pbarwrap"><div class="pbar" style="width:${Math.max(quranProgress, 3)}%"></div></div></span>
  </div>`;
  if (quranComplete(QPACK)) {
    const when = new Date(QPACK.downloaded).toLocaleDateString(undefined, { month: "short", day: "numeric" });
    const totalAyahs = QPACK.surahs.reduce((n, s) => n + s.ayah_count, 0);
    return `<div class="qstatus">
      <div class="qic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <span class="qtx"><b class="ok">All 114 suras offline</b> · ${totalAyahs.toLocaleString()} ayahs saved ${when ? "· updated " + when : ""}<br>the whole Quran reads without a connection</span>
      <button class="btn ghost small" id="quranDel">Remove</button>
    </div>`;
  }
  return `<div class="qstatus">
    <div class="qic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></div>
    <span class="qtx"><b>Save every sura offline</b><br>114 suras · 6,236 ayahs · ~2 MB${navigator.onLine ? "" : " · connect once to download"}</span>
    <button class="btn small" id="quranDl" style="white-space:nowrap">Download</button>
  </div>`;
}

function wireQuranStatus() {
  const d = $("#quranDl"), x = $("#quranDel");
  if (d) d.addEventListener("click", () => startQuranDownload(true));
  if (x) x.addEventListener("click", async () => {
    await quranDel(); QPACK = null; localStorage.setItem(QREMOVED_KEY, "1");
    toast("Offline Quran removed");
    renderQuran();
  });
}

async function startQuranDownload(announce) {
  if (quranBusy) return;
  if (!navigator.onLine) { toast("Connect to the internet once to download"); return; }
  quranProgress = 0;
  renderQuran();
  try {
    await downloadQuran(p => { quranProgress = p; const t = document.querySelector(".qstatus .qtx b"); if (t) { t.textContent = `Saving the Quran… ${p}%`; const bar = document.querySelector(".pbar"); if (bar) bar.style.width = Math.max(p, 3) + "%"; } });
    if (announce) toast("All 114 suras saved for offline reading");
    renderQuran();
  } catch (e) {
    toast("Quran download failed: " + e.message);
    renderQuran();
  }
}

function suraRowHTML(s) {
  return `<div class="srow" data-sura="${s.number}">
    <div class="snum">${arNum(s.number)}</div>
    <div class="snames"><div class="se">${esc(s.name_english)}</div><div class="st">${esc(s.name_transliteration)} · ${esc(s.revelation_place)}</div></div>
    <div class="smeta"><div class="sa">${esc(s.name_arabic.replace(/^سُورَةُ\s*/, ""))}</div><div class="sc">${s.ayah_count} ayahs</div></div>
  </div>`;
}

async function renderQuran() {
  const el = $("#content");
  const marks = ayahMarks();
  const lr = lastRead();
  el.innerHTML = `
    <div id="quranStatus">${quranStatusHTML()}</div>
    ${lr && lr.s ? `<div class="resume" id="resumeRead">
      <div class="ric">📖</div>
      <div class="rtx"><div class="r1">CONTINUE READING</div><div class="r2" id="resumeName">…</div></div>
      <div class="rarr">›</div>
    </div>` : ""}
    <div class="searchbar"><div class="sfield"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="sq" aria-label="Find a sura" placeholder="Find a sura — name, number, or theme" /></div></div>
    <div id="slist"><div class="loading">Loading suras…</div></div>
    ${marks.length ? `<p class="seclabel">BOOKMARKED AYAHS</p><div id="marks">${marks.map((m, i) => `
      <div class="markrow" data-ms="${m.s}" data-ma="${m.a}">
        <div class="mt">QURAN ${m.s}:${m.a}</div>
        <div class="ma">${esc(m.ar)}</div>
      </div>`).join("")}</div>` : ""}
    <p class="note" style="margin-top:16px">Ilm checks once a day that every sura is saved offline and re-downloads if anything is missing.</p>`;
  wireQuranStatus();
  if (lr && lr.s) {
    getSurahList().then(list => {
      const s = (list || []).find(x => x.number === lr.s);
      const n = $("#resumeName");
      if (n && s) n.textContent = `${s.name_english} · sura ${s.number}`;
    }).catch(() => {});
    $("#resumeRead").addEventListener("click", () => showSurah(lr.s, lr.a));
  }
  $("#sq").addEventListener("input", drawList);
  el.querySelectorAll(".markrow").forEach(r => r.addEventListener("click", () => showSurah(+r.dataset.ms, +r.dataset.ma)));
  async function drawList() {
    const listEl = $("#slist");
    const q = ($("#sq").value || "").trim().toLowerCase();
    let list;
    try { list = await getSurahList(); } catch (e) {
      listEl.innerHTML = `<div class="empty">Could not load the sura list${esc(e.message ? " — " + e.message : "")}.<br>Download the offline pack above to read without a connection.</div>`;
      return;
    }
    const filtered = q ? list.filter(s =>
      String(s.number) === q.replace(/^sura\s?/, "") ||
      (s.name_english || "").toLowerCase().includes(q) ||
      (s.name_transliteration || "").toLowerCase().includes(q) ||
      (s.name_arabic || "").includes(q)) : list;
    listEl.innerHTML = filtered.length
      ? filtered.map(suraRowHTML).join("")
      : `<div class="empty">No sura matches "${esc(q)}".</div>`;
    listEl.querySelectorAll(".srow").forEach(r => r.addEventListener("click", () => showSurah(+r.dataset.sura)));
  }
  drawList();
}

async function showSurah(n, focusAyah) {
  if (n < 1 || n > 114) return;
  const el = $("#content");
  el.innerHTML = `<button class="back" id="back2">← All suras</button><div class="loading">Loading sura…</div>`;
  let surah = null, ayahs = null, offline = true;
  if (quranComplete(QPACK)) {
    const s = QPACK.surahs.find(x => x.number === n);
    if (s) { surah = s; ayahs = s.ayahs; }
  }
  if (!surah) {
    offline = false;
    try {
      const d = await api(`/v1/quran/${n}?translation=en.sahih`);
      surah = d.surah;
      ayahs = (d.ayahs || []).map(a => [a.ayah_number, a.text_arabic, a.translation || ""]);
    } catch (e) {
      el.innerHTML = `<button class="back" id="back2">← All suras</button><div class="empty">This sura is not on your device yet.<br>Go back and download the offline Quran pack to read without a connection.</div>`;
      $("#back2").addEventListener("click", renderQuran);
      return;
    }
  }
  const { header, ayahs: shown } = splitBasmalah(n, ayahs);
  const marks = ayahMarks();
  const isMarked = a => marks.some(m => m.s === n && m.a === a);
  localStorage.setItem(LAST_READ_KEY, JSON.stringify({ s: n, a: focusAyah || 1, t: Date.now() }));
  el.innerHTML = `
    <button class="back" id="back2">← All suras</button>
    <div class="readerhead">
      <div class="rh-ar">${esc(surah.name_arabic)}</div>
      <div class="rh-en">${esc(surah.name_english)} · ${esc(surah.name_transliteration)}</div>
      <div class="rh-meta">Sura ${arNum(surah.number)} · ${surah.ayah_count} ayahs · ${esc(surah.revelation_place)}${offline ? "" : " · online"}</div>
    </div>
    ${header ? `<div class="bism">${esc(header)}</div>` : ""}
    <div id="ayahs">${shown.map(([an, ar, tr]) => `
      <div class="ayah" id="ay-${an}" data-an="${an}">
        <div class="atop">
          <span class="anum">QURAN ${surah.number}:${an}</span>
          <button class="abm ${isMarked(an) ? "on" : ""}" data-bm="${an}" title="Bookmark ayah">${isMarked(an) ? "★" : "☆"}</button>
        </div>
        <div class="aar">${esc(String(ar).replace(/\uFEFF/g, ""))}<span class="aymk">﴿${arNum(an)}﴾</div>
        ${tr ? `<div class="atr">${esc(tr)}</div>` : ""}
      </div>`).join("")}
    </div>
    <p class="translbl">Translation: Saheeh International · tap ☆ to bookmark an ayah</p>
    <div class="readerfoot">
      ${n > 1 ? `<button class="btn ghost" id="sprev">← Sura ${n - 1}</button>` : ""}
      ${n < 114 ? `<button class="btn" id="snext">Sura ${n + 1} →</button>` : ""}
    </div>`;
  $("#back2").addEventListener("click", renderQuran);
  const pv = $("#sprev"); if (pv) pv.addEventListener("click", () => showSurah(n - 1));
  const nx = $("#snext"); if (nx) nx.addEventListener("click", () => showSurah(n + 1));
  el.querySelectorAll("[data-bm]").forEach(b => b.addEventListener("click", ev => {
    ev.stopPropagation();
    const an = +b.dataset.bm;
    const row = b.closest(".ayah");
    const ar = row.querySelector(".aar").textContent.replace(/\uFEFF/g, "");
    const tr = (row.querySelector(".atr") || {}).textContent || "";
    const now = toggleAyahMark(n, an, ar, tr);
    b.textContent = now ? "★" : "☆";
    b.classList.toggle("on", now);
    toast(now ? `Quran ${n}:${an} bookmarked` : "Bookmark removed");
  }));
  el.querySelectorAll(".ayah").forEach(a => a.addEventListener("click", () => {
    localStorage.setItem(LAST_READ_KEY, JSON.stringify({ s: n, a: +a.dataset.an, t: Date.now() }));
  }));
  if (focusAyah) {
    const t = document.getElementById("ay-" + focusAyah);
    if (t) { t.classList.add("flash"); setTimeout(() => t.scrollIntoView({ behavior: "smooth", block: "center" }), 80); }
  } else window.scrollTo({ top: 0 });
}

// ---- root occurrences, shown inside the app's own Quran ----
async function renderQuranRoot(root) {
  const el = $("#content");
  const bare = packNormRoot(root);
  // the active tab pill moves to Quran while reading
  document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("active"));
  const qbtn = document.querySelector('.tabs button[data-tab="quran"]');
  if (qbtn) qbtn.classList.add("active");
  const goBack = () => { document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("active"));
    const b = document.querySelector(`.tabs button[data-tab="${tab}"]`); if (b) b.classList.add("active"); showRoot(root); };
  el.innerHTML = `<button class="back" id="qqBack">← Back</button><div class="loading">Finding ${esc(root)} in the Quran…</div>`;
  $("#qqBack").addEventListener("click", goBack);
  let occ;
  try {
    occ = await api("/v1/roots/" + encodeURIComponent(bare) + "/occurrences");
  } catch (e) {
    const notThere = /not found|no tagged/i.test(e.message || "");
    el.innerHTML = `<button class="back" id="qqBack">← Back</button><div class="empty">${notThere
      ? `This root does not appear in the Quran — its words are used in Arabic, but not in the Book.`
      : `Could not load Quran occurrences${esc(e.message ? " — " + e.message : "")}.${navigator.onLine ? "" : "<br>You are offline; reconnect once to cache this root."}`}</div>`;
    $("#qqBack").addEventListener("click", goBack);
    return;
  }
  let suras = [];
  try { suras = await getSurahList(); } catch (e) {}
  const sName = n => { const s = suras.find(x => x.number === n); return s ? s.name_english : "sura " + n; };
  const list = occ.occurrences || [];
  const bySura = new Map();
  list.forEach(o => {
    if (!bySura.has(o.surah_number)) bySura.set(o.surah_number, []);
    bySura.get(o.surah_number).push(o);
  });
  const suraIds = [...bySura.keys()].sort((a, b) => a - b);
  let shown = 60;
  const draw = () => {
    let count = 0;
    const rows = [];
    for (const sn of suraIds) {
      const sl = bySura.get(sn);
      const take = sl.slice(0, Math.max(0, shown - count));
      if (take.length === 0) break;
      count += take.length;
      rows.push(`<p class="seclabel" style="margin-top:14px">${arNum(sn)} · ${esc(sName(sn))} · ${sl.length}×${take.length < sl.length ? " — showing " + take.length : ""}</p>
        <div class="rootsgrid">${take.map(o => `
          <button class="rchip" data-qs="${o.surah_number}" data-qa="${o.ayah_number}" title="Quran ${o.surah_number}:${o.ayah_number}">
            <span class="ra">${esc(o.word || "")} <span style="opacity:.6;font-size:12px">(${arNum(o.surah_number)}:${arNum(o.ayah_number)})</span></span>
          </button>`).join("")}</div>`);
      if (count >= shown) break;
    }
    el.innerHTML = `<button class="back" id="qqBack">← Back</button>
      <div class="card" style="text-align:center">
        <div class="ar" style="font-size:32px">${esc(occ.root || root)}</div>
        ${occ.meaning ? `<div class="gloss" style="text-align:center">${esc(occ.meaning)}</div>` : ""}
        <div class="note" style="text-align:center">${list.length} place(s) in the Quran — tap any word form to read its ayah</div>
      </div>
      ${rows.join("")}
      ${count < list.length ? `<div style="text-align:center;margin:14px"><button class="btn ghost" id="qqMore">Show more (${list.length - count} left)</button></div>` : ""}`;
    $("#qqBack").addEventListener("click", goBack);
    el.querySelectorAll("[data-qs]").forEach(r => r.addEventListener("click", () => showSurah(+r.dataset.qs, +r.dataset.qa)));
    const m = $("#qqMore"); if (m) m.addEventListener("click", () => { shown += 200; draw(); });
  };
  draw();
}

// ---- tabs ----
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  tab = b.dataset.tab;
  if (tab === "search") renderSearch();
  else if (tab === "quran") renderQuran();
  else if (tab === "roots") renderRoots();
  else if (tab === "browse") renderBrowse();
  else renderWords();
}));
(async () => {
  try {
    const saved = await packGet();
    if (saved && saved.words && saved.words.length) PACK = buildIndexes(saved);
  } catch (e) {}
  try {
    const q = await quranGet();
    if (q && q.surahs && q.surahs.length) QPACK = q;
  } catch (e) {}
  renderSearch();
  quranDailyCheck(); // daily: make sure every single sura is saved offline
})();

});
